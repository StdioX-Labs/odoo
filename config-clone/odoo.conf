[options]
; ---------------------------------------------------------------------------
; LOCAL CLONE of prod (185.217.127.226:/root/odoo/config/odoo.conf)
; Lines marked [LOCAL] deviate from prod, with the reason given.
; NOTE: Odoo's parser does NOT support inline comments - keep them on own lines.
; ---------------------------------------------------------------------------

; Database settings
; [LOCAL] prod points at remote PG 62.171.137.101; here it's the `db` container
db_host = db
db_port = 5432
db_user = odoo
; [LOCAL] local-only throwaway credential
db_password = odoo_password
db_name = False
db_template = template0

; Server settings
http_port = 8069
; [LOCAL] prod=5; 0 keeps a single process for easier debugging
workers = 0
max_cron_threads = 1

; Multi-tenancy settings
dbfilter = ^LashesByShazz$
list_db = False
; [LOCAL] prod=True (behind Coolify Traefik); there is no proxy locally
proxy_mode = False

; Session settings
; [LOCAL] prod=True (HTTPS); local is plain HTTP and True would break login
session_cookie_secure = False
session_cookie_httponly = True
session_cookie_samesite = 'lax'

; Addons path
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; Logging
log_level = info
log_handler = :INFO

; Performance
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

; Security
admin_passwd = odoo_password
